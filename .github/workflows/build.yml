name: Build PepperPre Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
        
    - name: Compile installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" PepperPre_Installer.iss
        
    - name: Upload installer
      uses: actions/upload-artifact@v3
      with:
        name: PepperPre-Installer
        path: Output/PepperPre_Setup.exe
